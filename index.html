w.bloter.net/news/articleView.html?idxno=663985", "image_url": "https://cdn.bloter.net/news/thumbnail/202605/663985_276557_928_v150.jpg", "summary": "과기정통부가 부처 승격 1년 성과를 발표했어요. GPU 26만 장 확보, R&D 예산 35조5000억원, 국내 주목할 AI 모델 8개(세계 3위) 등 AI 인프라·법제·연구 지원을 대대적으로 확대한 게 핵심이에요 🚀\n\n우리 E&S 입장에서는 AI 데이터센터 확대와 대규모 GPU 도입이 전력·냉각 등 인프라 수요를 크게 늘릴 가능성이 커요. 데이터센터·SMR·에너지 솔루션 제공 기회가 생길 수 있어 준비가 필요해요 ⚡"}, {"rank": "5", "title": "스마일게이트, 2.8조 AI 데이터센터 짓는다…NPC도 AI로 진화", "publisher": "블로터", "date": "2026-05-30", "link": "https://www.bloter.net/news/articleView.html?idxno=663935", "image_url": "https://cdn.bloter.net/news/thumbnail/202605/663935_276482_3413_v150.jpg", "summary": "스마일게이트가 경기 고양시에 IT부하 기준 총 100MW 규모(문봉동·식사동) AI 데이터센터 2곳을 짓기로 했습니다. 사업비는 2조8000억원이고 국민성장펀드의 첨단전략산업기금이 지분투자와 후순위대출로 총 5000억원을 지원하기로 했어요 📊\n\n우리 E&S 입장에서는 대규모 데이터센터의 전력·냉방 수요가 신규 에너지 수요와 서비스 사업 기회를 만든다는 점이 핵심입니다. LNG 발전, ESS·마이크로그리드, 전력관리 솔루션 제공 등으로 협업할 여지가 큽니다 ⚡️"}], "energy": [{"rank": "1", "title": "[2026 데이터센터 서밋 코리아] AIDC특별법 통합 자문·수열 클러스터 선분양 제안", "publisher": "SW - AI - 전자신문", "date": "2026-06-01", "link": "https://www.etnews.com/20260601000223", "image_url": "https://img.etnews.com/news/article/2026/06/01/news-p.v1.20260601.6a819b2159ef40f08dc006dcd104d07c_P1.jpg", "summary": "내년 2월 AIDC 특별법 시행을 앞두고 열린 '2026 데이터센터 서밋'에서 법적 쟁점과 AI 데이터센터 인프라 방안이 집중 논의됐습니다. 강원 수열 클러스터는 소양강댐 냉수를 활용해 냉방 에너지를 64% 절감할 수 있다고 보고했고, 클러스터 안정 전력 공급을 위해 240MW 변전소 2개 설치를 제안했어요 💡\n\n우리 E&S 입장에서는 수백MW급 데이터센터 전력 수요와 수열·수냉·액침 같은 신냉각 인프라 도입이 발전·변전·열공급 수요 구조를 바꿀 가능성이 큽니다. 설계·투자·사업모델 측면에서 해당 이슈를 빠르게 검토해야 합니다 ⚙️"}, {"rank": "2", "title": "온세미, 엔비디아 MGX 생태계 내 전력 솔루션 강화... 차세대 AI 팩토리 시장 지원", "publisher": "인공지능신문", "date": "2026-06-04", "link": "https://www.aitimes.kr/news/articleView.html?idxno=40339", "image_url": "https://cdn.aitimes.kr/news/thumbnail/202606/40339_60863_1229_v150.jpg", "summary": "온세미가 엔비디아 MGX 생태계에서 AI 데이터센터용 전력 솔루션 지원을 강화했습니다. 800 VDC 전력 아키텍처를 기반으로 AI 랙당 전력 밀도를 1MW 이상으로 끌어올리는 것을 목표로 하고, SiC·GaN 전력 반도체부터 PSU·BBU·PDB까지 전력 계층 전반을 제공한다고 합니다💡\n\n우리 E&S 입장에서는 랙당 1MW급 전력 수요와 800VDC 아키텍처가 전력 공급, 변전·분배 설계와 냉각 요구에 직접적인 영향을 줍니다. 이에 따라 고전압 DC 인프라 검토와 SiC/GaN 등 부품 확보, 설비용량 재평가가 필요합니다⚡"}, {"rank": "3", "title": "[K배터리 리부트]① LG에너지솔루션, ESS로 북미 LFP 시장 선점", "publisher": "블로터", "date": "2026-06-01", "link": "https://www.bloter.net/news/articleView.html?idxno=664048", "image_url": "https://cdn.bloter.net/news/thumbnail/202606/664048_276587_3641_v150.jpg", "summary": "LG에너지솔루션이 전기차 수요 정체를 만회하기 위해 북미 LFP ESS 시장에 집중하고 있습니다. 올해 DTE에너지와 2년간 6GWh, 2조4000억원 규모 공급계약을 체결했으며 북미에 5곳의 생산 네트워크와 애리조나 LFP 공장 등 현지 생산을 확대하고 있습니다 ⚡\n\n우리 E&S 입장에서는 AI 데이터센터 중심의 ESS 수요 급증이 설비투자와 북미 현지화 전략의 중요한 실물 근거가 됩니다. IRA·AMPC 등 현지 인센티브와 SI 역량 결합이 실제 수익성 개선과 파트너십 기회를 만들 수 있으니 관련 전략을 검토해야 합니다 📈"}, {"rank": "4", "title": "(신재생學 춘계학술대회)AI가 공정 수행하는 탠덤태양전지 시대 첫발", "publisher": "전기신문", "date": "2026-05-29", "link": "https://www.electimes.com/news/articleView.html?idxno=368604", "image_url": "https://cdn.electimes.com/news/thumbnail/202605/368604_580553_2211_v150.jpg", "summary": "한화솔루션·에너지기술연구원·고려대·임픽스가 2029년까지 AI가 공정을 스스로 분석·최적화하는 ‘자율실험실’ 구축 과제를 추진합니다. 목표는 M10 탠덤 셀 효율 27.5% 달성과 MW급 양산 설계로, MES·장비·검사체계와 AI를 연결해 공정 데이터를 실시간 피드백하는 구조를 구현하는 것입니다 ⚡\n\n우리 E&S 입장에서는 AI 기반 공정 최적화가 태양광 제조의 수율과 품질 안정성에 직접적인 영향을 줄 수 있어 주목할 필요가 있습니다. 공정 데이터·MES 연계와 자율실험 플랫폼 경험은 우리 제조·운영 효율화 전략에 곧바로 참고할 만한 실무적 인사이트를 제공합니다 💡"}, {"rank": "5", "title": "&#53468;&#50577;&#44305; O&M &#49884;&#51109; &#54032;&#46020; &#48148;&#45072;&#45796;&hellip;&#45800;&#49692; &#49692;&#54924;&#51216;&#44160; &#45824;&#49888;  AI &#48516;&#49437;&#51004;&#47196;", "publisher": "전기신문", "date": "2026-05-30", "link": "https://www.electimes.com/news/articleView.html?idxno=368547", "image_url": "https://cdn.electimes.com/news/thumbnail/202605/368547_580461_416_v150.jpg", "summary": "에이치에너지가 소규모 태양광 발전소를 통합관리하는 플랫폼 '솔라온케어' 서비스를 확대했어요. AI 분석으로 우선 점검 대상을 진단하고, 발전량 저하를 찾아내며(충북 청주 사례: 2016년 대비 약 25% 감소 확인) 모바일로 3분 내 점검보고서를 작성하는 등 출장과 누락을 줄여 수익성 개선 사례를 만들고 있어요. 📈\n\n우리 E&S 입장에서는 분산형 태양광의 운영·자산관리 방식 변화가 보안·비용 측면에서 유리할 수 있습니다 🔒"}, {"rank": "4", "title": "OpenAI frontier models and Codex are now available on AWS", "publisher": "OpenAI Blog", "date": "2026-06-01", "link": "https://openai.com/index/openai-frontier-models-and-codex-are-now-available-on-aws", "image_url": "https://images.ctfassets.net/kftzwdyauwt9/2Tbsus4QAtPDAlsIM3vYO2/87f4c6894832d7937e54ecb3c245fdbe/OAI_AWS_Partnership_16x9_Art_Card.png?w=1600&h=900&fit=fill", "summary": "OpenAI의 최첨단(fronter) 모델들과 Codex가 이제 AWS에서 바로 이용 가능해졌습니다. 기업 고객은 기존 AWS 보안·거버넌스·결제 흐름 안에서 OpenAI 기능을 프로덕션으로 바로 가져갈 수 있어요. Codex는 매주 500만 명 이상이 사용하며 코드 작성·리뷰·디버깅을 돕습니다 🚀\n\n우리 E&S 입장에서는 AWS 환경에 OpenAI를 직접 도입할 수 있게 돼 보안·컴플라이언스와 구매 절차를 유지하면서도 파일럿을 빠르게 확장할 수 있습니다. Codex로 개발·유지보수 효율을 높이고, 향후 Daybreak 같은 보안 모델은 취약점 탐지·패치 검증에 바로 활용해볼 만합니다 💡"}, {"rank": "5", "title": "스노우플레이크, MCP 거버넌스 스타트업 나토마 인수", "publisher": "더에이아이", "date": "2026-05-29", "link": "http://www.newstheai.com/news/articleView.html?idxno=20777", "image_url": "https://cdn.newstheai.com/news/photo/202605/20777_21318_3337.jpeg", "summary": "스노우플레이크가 엔터프라이즈 AI 에이전트 거버넌스 스타트업 나토마를 인수했습니다. 나토마의 MCP 게이트웨이로 에이전트의 신원·권한·감사를 툴 호출 단위에서 강제하고, 슬랙·이메일·CRM 등 맥락을 스노우플레이크 데이터와 통합할 수 있게 됐습니다 🔐\n\n우리 E&S 입장에서는 자율형 에이전트가 LNG, 발전소, 내부 API 등 민감 시스템에 접근할 때 발생할 섀도우 AI·데이터 유출 리스크를 관리하기 위해 MCP 기반 거버넌스 레이어를 검토해야 합니다 ⚠️"}]}, "2026-22": {"biz_tech": [{"rank": "1", "title": "앤트로픽 ‘몸값’ 1447조원, 오픈AI 제쳐…98조원 투자 유치", "publisher": "전체기사 : 경제 : 뉴스 : 한겨레 뉴스 - 인터넷한겨레", "date": "2026-05-29", "link": "https://www.hani.co.kr/arti/economy/it/1260988.html", "image_url": "https://flexible.img.hani.co.kr/flexible/normal/800/534/imgdb/original/2026/0529/20260529500980.webp", "summary": "생성형 AI 개발사 앤트로픽이 시리즈 H에서 650억 달러(약 97조5천억 원)를 유치해 기업가치가 9650억 달러(약 1447조원)로 평가받았어요 🚀. 삼성전자와 SK하이닉스, 마이크론이 이번 라운드에 참여했고, 앤트로픽은 새 모델 ‘오퍼스 4.8’을 공개하며 성능과 정직성(코드 결함 지적 누락 확률 4배 감소)을 개선했다고 밝혔어요.\n\n우리 E&S 입장에서는 대형 AI사의 급성장이 데이터센터 전력 수요와 고성능 컴퓨팅 인프라 수요 증가로 이어질 가능성이 큽니다 ⚡. 이는 전력 공급, 냉각, LNG·재생에너지 연계 사업 기회와 설비 투자 수요를 다시 점검해야 한다는 신호예요."}, {"rank": : "‘자동화’ 전문 헥사곤에서 ‘데이터’ 전문 옥타브가 분사한 이유…”현장 유지에 초점”", "publisher": "AI타임스", "date": "2026-05-25", "link": "https://www.aitimes.com/news/articleView.html?idxno=210893", "image_url": "https://cdn.aitimes.com/news/photo/202605/210893_213695_1536.jpeg", "summary": "옥타브는 지난 3월 헥사곤 ALI에서 분사해 산업 현장용 '데이터→실행 인텔리전스'에 집중하는 독립 브랜드로 출범했어요. 설계 단계부터 수치 데이터를 넣어 도면 온톨로지를 만들고, 제조사 매뉴얼 자동 파싱으로 CMMS 로딩 템플릿과 구체적 정비 권고까지 생성하는 솔루션을 제공합니다. 이미 글로벌 포춘 500 기업의 60% 이상이 옥타브 솔루션을 사용하고 레이싱 팀과도 협업 중이라고 합니다. 📈\n\n우리 E&S 입장에서는 설계 단계부터 AI가 처리할 수 있는 수치·맥락 데이터 구조를 만들면 플랜트 안전과 예방정비 효율을 동시에 높일 수 있어요. CMMS 연동과 설계→자재→보전의 데이터 흐름을 먼저 시범 적용해 벤치마킹할 만합니다. ⚙️"}, {"rank": "3", "title": "공공SW 발주 AI 에이전트가 지원…조달청, 공공조달 AX 본격화", "publisher": "SW - AI - 전자신문", "date": "2026-05-25", "link": "https://www.etnews.com/20260522000281", "image_url": "https://img.etnews.com/news/article/2026/05/18/news-p.v1.20260518.23c46ee2a3214c829a65b3636988aca3_P1.png", "summary": "조달청과 NIA가 공공SW 발주에 AI 에이전트를 도입하는 '공공SW AI 책임형 발주관리 플랫폼'을 구축합니다. RFP 작성·법규 검토·산출내역서 작성·과업심의 지원을 자동화해 RFP 처리시간을 30~40% 단축하고 행정비용을 20~25% 절감하겠다는 목표예요 📊\n\n우리 E&S 입장에서는 발주·계약·프로젝트 관리 프로세스를 자동화하고 표준화할 좋은 벤치마크 예시예요. 특히 RFP 자동화와 경량화 LLM(sLLM) 도입은 대형 발주와 법규 준수 점검에서 바로 활용 가능해요 💡"}, {"rank": "4", "title": "수자원공사, 광역정수장 점검로봇 시범 도입", "publisher": "투데이에너지", "date": "2026-05-24", "link": "https://www.todayenergy.kr/news/articleView.html?idxno=298209", "image_url": "https://cdn.todayenergy.kr/news/thumbnail/202605/298209_169994_4922_v150.jpg", "summary": "한국수자원공사(K-water)가 2026년부터 4족 보행 점검로봇을 광역정수장 4곳에 시범 도입한다고 발표했어요. 2025년 화성정수장에서 6회 실증을 통해 계단·협소 통로 주행과 영상·열화상·소음·농도 등 데이터 수집 가능성을 확인했으며, 이후 2027~2030년에는 44개 사업장으로 확대하고 사업비는 260억 원입니다. 🚀\n\n우리 E&S 입장에서는 고위험 현장 점검의 안전성 확보와 설비 상태의 정량적 관리를 동시에 얻을 수 있어 즉시 벤치마킹할 가치가 큽니다. 출입문 전동화나 동선 개선 등 현장 인프라 개편과 관제·AI 분석 연계가 핵심이라 시범 적용 가능성을 검토해보면 좋겠습니다. 🔧"}, {"rank": "5", "title": "Building self-improving tax agents with Codex", "publisher": "OpenAI Blog", "date": "2026-05-27", "link": "https://openai.com/index/building-self-improving-tax-agents-with-codex", "image_url": "https://images.ctfassets.net/kftzwdyauwt9/3upo248JfOrgp0fahNLrkt/10f9e23a8be06e38fb21d29faf5e320d/SEO.png?w=1600&h=900&fit=fill", "summary": "OpenAI와 Thrive가 Crete 소속 30여 회계법인을 대상으로 Codex 기반 'Tax AI' 파일럿을 개발해 이번 시즌에 7,000건의 세무신고를 처리했어요. 시스템은 세무 준비 시간을 약 3분의 1로 줄이고 초안 정확도는 최대 97%, 처리량은 약 50% 증가시키며 운영 데이터와 실무자 수정을 통해 스스로 개선됩니다 💡\n\n우리 E&S 입장에서는 실무자 피드백·생산 트레이스·에이전트 기반 개선 루프를 결합한 구조가 세무뿐 아니라 규제보고, 자산 문서화, 구매·정산 같은 문서 중심 업무에 바로 적용될 수 있어요. 내부 회계·감사·운영 효율을 위해 유사한 '실무자 주도' 증거 캡처와 평가 파이프라인을 시범 도입해볼 필요가 있습니다 ⚙️"}]}, "2026-21": {"biz_tech": [{"rank": "1", "title": "Nvidia posts another record quarter, reveals $43 billion of holdings in startups", "publisher": "AI | TechCrunch", "date": "2026-05-20", "link": "https://techcrunch.com/2026/05/20/nvidia-posts-another-record-quarter-reveals-43-billion-of-holdings-in-startups/", "image_url": "https://techcrunch.com/wp-content/uploads/2026/03/jensen-huang-gtc-getty.jpg?resize=1200,781", "summary": "Nvidia가 4월 분기 실적을 발표했는데 매출이 $81.6B로 또 기록을 경신했고 데이터센터 매출이 $75.2B에 달했어요. 분기 중 비상장 기업 지분 보유액이 $22B에서 $43B로 급증했고 한 분기에만 $18.5B를 사들였어요. 회사는 $80B 자사주 매입을 승인했고 다음 분기 매출은 $91B로 성장 둔화를 전망했습니다 🚀\n\n우리 E&S 입장에서는 Nvidia의 대규모 데이터센터 매출과 Anthropic 등과의 확장 계획이 전력 수요와 전력설비, 재생에너지 공급 기회에 직접적인 신호예요. 설비·전력계약 수요를 미리 점검하고 관련 사업 기회를 검토할 필요가 있어요 ⚡"}, {"rank": "2", "title": "구글-블랙스톤, 37조 투입해 'TPU 전용' AI 클라우드 기업 설립", "publisher": "AI타임스", "date": "2026-05-19", "link": "https://www.aitimes.com/news/articleView.html?idxno=210688", "image_url": "https://cdn.aitimes.com/news/photo/202605/210688_213422_3236.png", "summary": "구글과 블랙스톤이 약 250억달러(약 37조원)를 투입해 구글 TPU를 외부에 공급하는 AI 클라우드 합작사를 설립하기로 했어요. 이 회사는 2027년까지 500MW 규모의 데이터센터 전력을 확보하는 것을 목표로 대규모 인프라 투자를 진행할 예정이에요 🚀\n\n우리 E&S 입장에서는 대규모 전력수요와 데이터센터 건설이 전력공급과 운영 확대의 직접적인 기회이자 검토해야 할 리스크예요. 전력계약, 발전소 확장, 재생에너지 연계 등 구체적 대응 방안을 빠르게 점검할 필요가 있습니다 ⚡"}, {"rank": "3", "title": "AWS, 역대 최대 12.6조 국내 투자...\"한국 피지컬 AI 도약 지원\"", "publisher": "AI타임스", "date": "2026-05-20", "link": "https://www.aitimes.com/news/articleView.html?idxno=210766", "image_url": "https://cdn.aitimes.com/news/photo/202605/210766_213540_433.jpeg", "summary": "AWS가 2018년부터 2031년까지 누적 12조6000억원을 한국에 투자하겠다고 발표하고, 서울 서밋에서 '피지컬 AI 프론티어' 프로그램 등 AI 전 과정 지원 방안을 공개했어요. 행사에서는 AI-DLC·에이전틱 AI·피지컬 AI를 핵심 혁신으로 제시하며 LG전자·CJ올리브영 사례와 키로·아마존 퀵 등 새 도구도 소개했어요 🚀\n\n우리 E&S 입장에서는 AWS의 대규모 투자와 데이터센터·피지컬 AI 생태계 확장이 전력 수요와 인프라 수요를 크게 늘릴 가능성이 큽니다. 전력공급, 그리드 안정화, 재생에너지 연계 및 에너지 저장 등에서 구체적 사업 기회를 검토해야 할 거예요 ⚡"}, {"rank": "4", "title": "델, AI 인프라 '끝판왕' 노린다…스토리지·보안·자동화 전면 개편", "publisher": "최신 뉴스 - IT세상을 바꾸는 힘 지디넷코리아", "date": "2026-05-19", "link": "https://zdnet.co.kr/view/?no=20260520053906", "image_url": "https://image.zdnet.co.kr/2026/05/20/77805f0da90d8aa072334a99c01c381c.png", "summary": "델이 DTW 2026에서 AI 네이티브 데이터센터용 스토리지·서버·네트워크·보안·자동화 포트폴리오를 대거 공개했어요. 라이트닝(랙당 150GB/s), 랙당 최대 144GPU 액체냉각 서버, 최대 496Tbps 스위치 등 고밀도·고성능 장비와 통합 백업·AI 기반 탐지 솔루션을 선보였어요 💡\n\n우리 E&S 입장에서는 이런 랙스케일·액체냉각·통합 전력 설계가 전력·냉각 수요와 인프라 개조 기회를 크게 늘릴 거예요. 자동화·사이버 복원력 강화는 운영 효율과 리스크 관리 측면에서 바로 검토할 만한 사안이에요 ⚡"}, {"rank": "5", "title": "오픈AI 'GPT-5.5', 英 AI 보안 평가서 앤트로픽 '미토스' 제쳤다", "publisher": "SW - AI - 전자신문", "date": "2026-05-17", "link": "https://www.etnews.com/20260517000089", "image_url": "https://img.etnews.com/news/article/2026/04/24/news-p.v1.20260424.7b090ef2d30e4e8b838614c57d0fb623_P1.png", "summary": "오픈AI의 최신 모델 GPT-5.5가 영국 AI안전연구소(AISI) 사이버 보안 평가에서 전문가 수준 과제 평균 통과율 71.4%를 기록했어요. 95개 과제로 진행된 평가에서 '더 라스트 원스' 침투 시뮬레이션을 10번 시도해 2번 완주했고, 앤트로픽 클로드 미토스는 같은 조건에서 3번 성공했어요⚠️\n우리 E&S 입장에서는 이 결과가 산업제어시스템(ICS) 같은 에너지 인프라에 대한 AI 기반 공격 가능성을 보여준다고 봐야 합니다. 모니터링·접근통제 강화와 AI 보안 대응 훈련을 서둘러야 합니다🔒"}], "energy": [{"rank": "1", "title": "\"AI 패권은 전력 싸움\"…메타, 美에 2000억 달러 'AI 성' 쌓는다", "publisher": "최신 뉴스 - IT세상을 바꾸는 힘 지디넷코리아", "date": "2026-05-19", "link": "https://zdnet.co.kr/view/?no=20260519091122", "image_url": "https://image.zdnet.co.kr/2025/07/03/61316c6f08635d29dabe313ebfe0e413.png", "summary": "메타가 루이지애나 리치랜드 패리시에 2000억 달러(약 299조원) 규모의 대형 AI 데이터센터 '하이페리온'을 건설합니다. 이 시설은 약 5GW 수준의 전력을 소모할 것으로 예상되고, 전력 확보를 위해 현지 전력사와 가스 발전기 10기 건설 계획이 포함돼 있어요. 데이터센터 운영을 위한 부지·칩·자금 조달을 결합한 초대형 인프라 투자라는 점도 특징입니다 ⚡\n\n우리 E&S 입장에서는 이런 대규모 전력 수요가 발전소 건설, 전력계약(PPA), 송전·유연성 자원 수요에 직접적인 영향을 줍니다. 대규모 전력공급이나 저장·수소·가스발전 연계 솔루션 제안 가능성을 검토해야 할 때예요 💡"}, {"rank": "2", "title": "AI발 전력망 신규 건설·교체 특수…‘전선’ 전성시대 활짝", "publisher": "경향신문:경제", "date": "2026-05-17", "link": "https://www.khan.co.kr/article/202605172042035/?utm_source=khan_rss&utm_medium=rss&utm_campaign=economy_news", "image_url": "https://img.khan.co.kr/news/2026/05/17/l_2026051801000462700044941.jpg", "summary": "국내 전선업체들이 1분기에 역대급 실적을 냈습니다. AI 데이터센터 건설으로 초고압 전력망과 HVDC·해저케이블 수요가 급증한 덕분이에요 ⚡<br>우리 E&S 입장에서는 데이터센터 전력증가와 노후망 교체가 직접적인 수요 기회인 동시에 구리 등 원자재·공급망 리스크도 키우는 상황이라 전략적 조달과 인프라 투자 계획을 다시 점검해야 합니다 💡"}, {"rank": "3", "title": "[창간기획]“AI 산업 경쟁은 에너지 경쟁”…한국가스공사, LNG 인프라 디지털화 확대", "publisher": "에너지데일리", "date": "2026-05-18", "link": "http://www.energydaily.co.kr/news/articleView.html?idxno=167261", "image_url": "http://www.energydaily.co.kr/news/thumbnail/202605/167261_118424_5013_v150.jpg", "summary": "한국가스공사가 전국 5개 LNG 터미널과 저장용량 약 1,216만㎥, 5,206km 환상배관망을 AI·빅데이터로 디지털화하고 있어요. 당진 제5기지에 통합 AI센터와 BARAm 자동운전 시스템을 도입해 실시간 예측진단과 운전자 조작 빈도 약 39% 감소 같은 성과를 내고 있습니다. AI 데이터센터 확대 등으로 전력 수요가 급증해 LNG 인프라의 전략적 중요성이 더 커지고 있어요.💡\\n\\n우리 E&S 입장에서는 이런 디지털 전환이 설비 안전·유지보수 효율과 전력 확보 전략에 바로 연결되는 사안이에요. 디지털트윈·예측운영 도입과 기존 배관을 활용한 수소 전환 가능성은 사업 기회이자 우선 점검해야 할 리스크입니다.⚡"}, {"rank": "4", "title": "“전력망 접속 기다릴 시간 없다” 美 빅테크, AI 데이터센터 ‘온사이트 가동’ 봇물", "publisher": "전기신문", "date": "2026-05-20", "link": "https://www.electimes.com/news/articleView.html?idxno=368246", "image_url": "https://cdn.electimes.com/news/thumbnail/202605/368246_579967_5726_v150.jpg", "summary": "MS, AWS, 구글, 메타 등 주요 빅테크가 전력망 연결을 기다리지 않고 데이터센터 부지에 SMR(소형원전), 가스터빈, 수소 연료전지, 태양광+ESS 등 자체 발전 설비를 직접 구축하고 있어요. 업계는 2030년까지 데이터센터의 약 33%가 온사이트 전력으로 운영될 것으로 보고 있고, LS일렉트릭은 미국에 약 6400만 달러(한화 약 960억 원) 규모의 38kV급 고압 배전반 공급 계약을 따냈어요⚡\n우리 E&S 입장에서는 이 흐름이 마이크로그리드·ESS·연료전지·전력변환장치 등 장비와     let currentWeekKey = "2026-23";
    let currentCat = "biz_tech";

    // 드롭다운 채우기
    const picker = document.getElementById('weekPicker');
    allWeeks.forEach(wk => {
      const opt = document.createElement('option');
      opt.value = wk.key; opt.textContent = wk.label;
      if (wk.key === currentWeekKey) opt.selected = true;
      picker.appendChild(opt);
    });

    function currentIndex() { return allWeeks.findIndex(w => w.key === currentWeekKey); }

    function updateNavButtons() {
      const i = currentIndex();
      document.getElementById('prevBtn').disabled = i >= allWeeks.length - 1;
      document.getElementById('nextBtn').disabled = i <= 0;
    }

    // 정적 페이지: 서버 호출 없이 화면만 전환
    function moveWeek(key) {
      currentWeekKey = key;
      picker.value = key;
      updateNavButtons();
      render((ALL_DATA[currentWeekKey] || {})[currentCat] || []);
    }

    function navigateAdjacent(dir) {
      const target = currentIndex() - dir;
      if (target >= 0 && target < allWeeks.length) moveWeek(allWeeks[target].key);
    }

    function showTab(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render((ALL_DATA[currentWeekKey] || {})[cat] || []);
    }

    function render(items) {
      const container = document.getElementById('news-container');
      if (!items || items.length === 0) {
        container.innerHTML = '<div style="text-align:center; grid-column:1/-1; padding:50px; color:#999;">표시할 기사가 없습니다.</div>';
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="card">
          <div class="card-top">
            <div class="rank-badge">Top ${item.rank}</div>
            <div class="date-text">${item.date || ''}</div>
          </div>
          ${item.image_url ? `<img class="thumb" src="${item.image_url}">` : ''}
          <div class="card-title">${escapeHtml(item.title)}</div>
          <div class="meta">${escapeHtml(item.publisher)}</div>
          <div class="summary-section">${formatSummaryToSections(item.summary)}</div>
          <div class="button-wrap"><a href="${item.link}" class="link-btn" target="_blank" rel="noopener">원문 보러가기 ✈️</a></div>
        </div>
      `).join('');
    }

    function formatSummaryToSections(text) {
      if (!text) return "";
      let t = String(text)
        .replace(/<\s*br\s*\/?\s*>/gi, '\n')
        .replace(/\\n/g, '\n')
        .replace(/\n{2,}/g, '\n\n')
        .trim();
      let paras = t.split(/\n\s*\n/).filter(Boolean);
      if (paras.length === 1) paras = t.split(/\n/).filter(Boolean);
      let html = "";
      html += `<div class="summary-block"><div class="summary-label">📋 요약</div>
               <div class="summary-content">${formatParagraph(paras[0] || "")}</div></div>`;
      html += `<div class="insight-block"><div class="summary-label">💡 Insight</div>
               <div class="summary-content">${formatParagraph(paras[1] || "")}</div></div>`;
      return html;
    }

    function formatParagraph(s) {
      if (!s) return "";
      const m = s.match(/^(.+?[.!?]|.+?다\.|.+?네요\.)(\s|$)/);
      if (m) return `<p><strong>${escapeHtml(m[1])}</strong>${escapeHtml(s.slice(m[1].length))}</p>`;
      return `<p>${escapeHtml(s)}</p>`;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? "" : s;
      return d.innerHTML;
    }

    // 초기 렌더링
    updateNavButtons();
    render((ALL_DATA[currentWeekKey] || {}).biz_tech || []);
  </script>
</body>
</html>
